<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALIF | Official Store</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; 
            margin: 0; padding: 0; background-color: #fff; color: #000; line-height: 1.6;
        }
        header { 
            background: #000; color: #fff; padding: 60px 20px; text-align: center;
        }
        header h1 { 
            margin: 0; font-size: 3rem; letter-spacing: 12px; font-weight: 900; text-transform: uppercase;
        }
        header p { 
            margin-top: 10px; letter-spacing: 4px; font-size: 0.7rem; text-transform: uppercase; opacity: 0.7;
        }
        .store-container { padding: 20px; max-width: 500px; margin: auto; }
        .product-card { margin-bottom: 50px; text-align: center; }
        .image-box { 
            width: 100%; height: 450px; background: #f4f4f4; display: flex; 
            align-items: center; justify-content: center; color: #bbb; 
            text-transform: uppercase; font-size: 0.8rem; letter-spacing: 2px;
        }
        .product-info { padding: 20px 0; }
        .product-title { font-size: 1.3rem; font-weight: bold; margin: 0; text-transform: uppercase; letter-spacing: 1px; }
        .price { font-size: 1.1rem; color: #555; margin: 5px 0 20px 0; }
        .order-btn { 
            display: block; background: #000; color: #fff; text-align: center; 
            padding: 20px; text-decoration: none; font-weight: bold; 
            letter-spacing: 2px; text-transform: uppercase; font-size: 0.9rem;
        }
        footer { padding: 60px 20px; text-align: center; font-size: 0.7rem; letter-spacing: 2px; color: #aaa; text-transform: uppercase; }
    </style>
</head>
<body>

    <header>
        <h1>ALIF</h1>
        <p>The Beginning of Style</p>
    </header>

    <div class="store-container">
        
        <!-- PRODUCT 1 -->
        <div class="product-card">
            <div class="image-box">Photo Coming Soon</div>
            <div class="product-info">
                <p class="product-title">ALIF Essential Tee</p>
                <p class="price">Rs. 2,500</p>
                <a href="https://wa.me/923179013939" class="order-btn">Order on WhatsApp</a>
            </div>
        </div>

        <!-- PRODUCT 2 -->
        <div class="product-card">
            <div class="image-box">Photo Coming Soon</div>
            <div class="product-info">
                <p class="product-title">ALIF Signature Hoodie</p>
                <p class="price">Rs. 4,500</p>
                <a href="https://wa.me/YOURNUMBER" class="order-btn">Order on WhatsApp</a>
            </div>
        </div>

    </div>

    <footer>
        &copy; 2026 ALIF STUDIO. <br>
        Crafted with Purpose.
    </footer>

</body>
</html>
